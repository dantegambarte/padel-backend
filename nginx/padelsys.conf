# ══════════════════════════════════════════════════════
#  Nginx — Configuración PadelSys
#  Ubicación en el VPS: /etc/nginx/sites-available/padelsys
#
#  Activar con:
#    sudo ln -s /etc/nginx/sites-available/padelsys /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # Certbot coloca aquí la validación para SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # ── Certificados SSL (Let's Encrypt via Certbot) ────
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Seguridad ───────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Frontend Angular (archivos estáticos) ───────────
    # El build de Angular se sube a /var/www/padelsys/
    root /var/www/padelsys;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA routing
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Assets con cache largo (Angular genera hashes en nombres de archivo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend NestJS (API) ────────────────────────────
    # Todo lo que empiece con /api/ se redirige al puerto 3000
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (importante para queries pesadas de reportes)
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  60s;

        # Tamaño máximo de body (subida de imágenes de productos)
        client_max_body_size 10M;
    }

    # Logs
    access_log /var/log/nginx/padelsys-access.log;
    error_log  /var/log/nginx/padelsys-error.log;
}
