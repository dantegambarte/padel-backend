# ══════════════════════════════════════════════════════
#  Nginx — Configuración PadelSys
#  Ubicación en el VPS: /etc/nginx/sites-available/padelsys
#
#  Este archivo es una PLANTILLA: el dominio real no se versiona.
#  Renderizar en el VPS (la lista explícita '${DOMAIN}' evita que
#  envsubst reemplace variables propias de nginx como $host o $uri):
#    export DOMAIN=example.com
#    envsubst '${DOMAIN}' < nginx/padelsys.conf > /etc/nginx/sites-available/padelsys
#
#  Activar con:
#    sudo ln -s /etc/nginx/sites-available/padelsys /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════

# Rate limit for login/refresh (http context: this file is included
# from http {} via sites-enabled). 10 req/min per client IP.
limit_req_zone $binary_remote_addr zone=padelsys_auth:10m rate=10r/m;

# Redirigir HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Certbot coloca aquí la validación para SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN} www.${DOMAIN};

    # ── Certificados SSL (Let's Encrypt via Certbot) ────
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Seguridad ───────────────────────────────────────
    # add_header in a location drops these server-level headers, so every
    # location that declares its own add_header repeats this block.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compresión ──────────────────────────────────────
    # Comprime respuestas de texto (bundles de Angular y JSON de la API).
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript application/xml image/svg+xml;

    # ── Frontend Angular (archivos estáticos) ───────────
    # El build de Angular se sube a /var/www/padelsys/
    root /var/www/padelsys;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA routing
        expires 1h;
        add_header Cache-Control "public, no-transform";
        # Security headers repeated (see server block).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Assets con cache largo (Angular genera hashes en nombres de archivo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers repeated (see server block).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Login / refresh con rate limit ──────────────────
    location ~ ^/api/v1/auth/(login|refresh)$ {
        limit_req        zone=padelsys_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  60s;
    }

    # ── Backend NestJS (API) ────────────────────────────
    # Todo lo que empiece con /api/ se redirige al puerto 3000
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (importante para queries pesadas de reportes)
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  60s;

        # Tamaño máximo de body (subida de imágenes de productos)
        client_max_body_size 10M;
    }

    # Logs
    access_log /var/log/nginx/padelsys-access.log;
    error_log  /var/log/nginx/padelsys-error.log;
}
